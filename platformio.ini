; PlatformIO Project Configuration File — MoneyLaundring, Module 1 (bring-up)
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags = -Wall -Wextra

; Module 2: native unit tests for the pure Axis bounce-logic class. Only
; Axis.cpp is built here (via build_src_filter) so this environment never
; touches Arduino.h, config.h, or any ESP32-specific code; it builds and
; runs with a plain host g++.
[env:native]
platform = native
build_flags = -std=gnu++14 -Wall -Wextra
test_build_src = yes
build_src_filter = -<*> +<Axis.cpp>
